name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ve
          POSTGRES_PASSWORD: ve
          POSTGRES_DB: ve_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ve/api build

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ve
          POSTGRES_PASSWORD: ve
          POSTGRES_DB: ve
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ve/web build
      - run: pnpm --filter @ve/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ve/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for 'tools', which the current sdkmanager no longer has.
          packages: platform-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ve/mobile test
      - name: Release APK
        working-directory: apps/mobile/android
        env:
          VE_API_URL: https://api.example.invalid
        run: ./gradlew assembleRelease --no-daemon
      - name: APK size (≤ 20 MB per ABI)
        run: apps/mobile/scripts/check-apk-size.sh apps/mobile/android/app/build/outputs/apk/release 20
