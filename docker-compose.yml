services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ve
      POSTGRES_PASSWORD: ve
      POSTGRES_DB: ve
    ports:
      - "5433:5432"
    volumes:
      - ve-pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  ve-pg:
